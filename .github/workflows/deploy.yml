name: Deploy Site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [data-updated]

env:
  NODE_VERSION: "22"
  DATA_BASE_URL: https://data.hn-job-trends.gantryops.dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Use latest data
        env:
          DATA_BRANCH: ${{ github.event.client_payload.data_branch || github.ref_name }}
        run: |
          git -C hn-jobs-data remote set-url origin https://github.com/gantrydev/hn-jobs-data.git
          if git -C hn-jobs-data ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git -C hn-jobs-data fetch --depth=1 origin "$DATA_BRANCH"
          else
            git -C hn-jobs-data fetch --depth=1 origin main
          fi
          git -C hn-jobs-data checkout --detach FETCH_HEAD
          git -C hn-jobs-data log --oneline -1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          DATA_BASE_URL: ${{ env.DATA_BASE_URL }}
          NEXT_PUBLIC_DATA_BASE_URL: ${{ env.DATA_BASE_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
